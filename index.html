<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hội Nghị Khách Hàng 3M &amp; Phước Khang — Kiến Tạo Giá Trị</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Thư mời tham dự Hội Nghị Khách Hàng: Kiến Tạo Giá Trị cùng 3M & Phước Khang vào ngày 24/10/2026 tại TP.HCM.">
  <meta property="og:title" content="Hội Nghị Khách Hàng 3M & Phước Khang">
  <meta property="og:description" content="Kính mời Quý Khách Hàng đến tham dự sự kiện và khám phá các giải pháp công nghệ mới.">
  <meta property="og:image" content="home.jpg">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,600&display=swap" rel="stylesheet">

  <!-- File CSS Riêng Biệt -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-fullscreen-body">

  <!-- Lớp nền mờ Ambient Glow từ chính poster home.jpg tạo chiều sâu sang trọng -->
  <div class="landing-ambient-backdrop" aria-hidden="true"></div>
  <div class="landing-ambient-overlay" aria-hidden="true"></div>

  <!-- CONTAINER CHÍNH CỦA TRANG LANDING -->
  <main class="fullscreen-landing-container">
    
    <!-- 1. Header huy hiệu sự kiện thanh nhã -->
    <header class="landing-top-badge-wrap">
      <div class="landing-top-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">THƯ MỜI CHÍNH THỨC • 3M &amp; PHƯỚC KHANG</span>
      </div>
    </header>

    <!-- 2. Khung ảnh Poster home.jpg hiển thị trọn vẹn 100% nội dung (Zero-Crop) -->
    <div class="landing-poster-card-wrap">
      <div class="landing-poster-card" id="posterCard">
        <img 
          src="home.jpg" 
          alt="Hội Nghị Khách Hàng 3M &amp; Phước Khang — Kiến Tạo Giá Trị" 
          class="fullscreen-poster-img"
          id="homePosterImg"
          loading="eager"
        >
        <!-- Nút chạm để phóng to xem chi tiết ảnh poster -->
        <button type="button" class="btn-poster-zoom-hint" id="btnOpenLightbox" aria-label="Phóng to xem trọn vẹn poster">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span>Chạm để phóng to</span>
        </button>
      </div>
    </div>

    <!-- 3. Huy hiệu thông tin nhanh sự kiện trên điện thoại -->
    <div class="landing-quick-meta">
      <span class="quick-meta-pill">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        24.10.2026
      </span>
      <span class="quick-meta-pill">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Riverside Palace, TP.HCM
      </span>
    </div>

    <!-- 4. Thanh nút bấm Xem chi tiết trôi nổi sang trọng -->
    <div class="fullscreen-floating-bar">
      <a href="detail.html" id="btnViewDetails" class="btn-fullscreen-cta">
        <span>Xem Chi Tiết Sự Kiện</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
      <div class="fullscreen-subtext">
        Chạm để xem lịch trình chương trình &amp; xác nhận tham dự
      </div>
    </div>

  </main>

  <!-- 5. LIGHTBOX MODAL: Phóng to toàn màn hình ảnh Poster sắc nét không cắt mép -->
  <div class="poster-lightbox-modal" id="posterLightbox" aria-hidden="true" role="dialog" aria-label="Xem ảnh poster chi tiết">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <button type="button" class="lightbox-close-btn" id="btnCloseLightbox" aria-label="Đóng xem ảnh">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span>Đóng</span>
    </button>
    <div class="lightbox-content-wrap">
      <img src="home.jpg" alt="Poster Hội Nghị Khách Hàng 3M &amp; Phước Khang 2026" class="lightbox-img" id="lightboxImg">
      <p class="lightbox-caption">Dùng hai ngón tay hoặc cuộn để phóng to chi tiết ảnh poster</p>
    </div>
  </div>

  <!-- Script điều khiển Lightbox và giữ nguyên tham số cá nhân hóa (?to=Tên_Khách hoặc ?name=...) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Giữ tham số URL cho nút chuyển sang detail.html
      const btn = document.getElementById('btnViewDetails');
      if (btn && window.location.search) {
        btn.href = 'detail.html' + window.location.search;
      }

      // 2. Xử lý Lightbox phóng to Poster
      const lightbox = document.getElementById('posterLightbox');
      const openBtn = document.getElementById('btnOpenLightbox');
      const closeBtn = document.getElementById('btnCloseLightbox');
      const backdrop = document.getElementById('lightboxBackdrop');
      const posterCard = document.getElementById('posterCard');

      function openLightbox() {
        if (!lightbox) return;
        lightbox.classList.add('active');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        if (!lightbox) return;
        lightbox.classList.remove('active');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      if (openBtn) openBtn.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(); });
      if (posterCard) posterCard.addEventListener('click', () => openLightbox());
      if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
      if (backdrop) backdrop.addEventListener('click', closeLightbox);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox && lightbox.classList.contains('active')) {
          closeLightbox();
        }
      });
    });
  </script>
</body>
</html>
